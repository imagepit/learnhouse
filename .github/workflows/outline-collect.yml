on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    uses: imagepit/agent-skills/.github/workflows/outline-sync-collect.yml@main
    secrets: inherit
