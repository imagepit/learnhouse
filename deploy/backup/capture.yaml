apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: learnhouse-backup-staging
  namespace: learnhouse
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 32Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learnhouse-backup-capture
  namespace: learnhouse
spec:
  schedule: "0 6 * * *"
  timeZone: Asia/Tokyo
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1650
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: capture
              image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
              command: [sh, -ec]
              args:
                - |
                  apt-get update -qq >/dev/null 2>&1 &&
                  apt-get install -y -qq --no-install-recommends python3 tzdata >/dev/null 2>&1 || {
                    echo '{"stage":"client_setup","result":"failed"}'
                    exit 1
                  }
                  exec python3 -B /program/backup.py capture
              env:
                - name: PGHOST
                  value: learnhouse-postgres
                - name: PGDATABASE
                  value: learnhouse
                - name: PGUSER
                  value: learnhouse
                - name: PGCONNECT_TIMEOUT
                  value: "10"
                - name: PGOPTIONS
                  value: "-c default_transaction_read_only=on"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: learnhouse-env
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - {name: program, mountPath: /program, readOnly: true}
                - {name: content, mountPath: /content, readOnly: true}
                - {name: catalog, mountPath: /catalog, readOnly: true}
                - {name: staging, mountPath: /backup}
          volumes:
            - name: program
              configMap:
                name: learnhouse-backup-program
            - name: content
              persistentVolumeClaim:
                claimName: learnhouse-content
                readOnly: true
            - name: catalog
              configMap:
                name: learnhouse-outline-image-catalog
            - name: staging
              persistentVolumeClaim:
                claimName: learnhouse-backup-staging
