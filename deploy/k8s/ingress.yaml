apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnhouse
  namespace: learnhouse
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: learnhouse.image-pit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: learnhouse
                port:
                  number: 80
